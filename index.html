<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101014">
  <meta name="description" content="Todas las redes sociales de Jorgigamers en un solo lugar.">
  <title>Jorgigamers · Mis redes</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      background: #101014;
      color: #f7f7fa;
      font-family: system-ui, sans-serif;
    }
    main { width: min(100%, 29rem); }
    header { text-align: center; margin-bottom: 2rem; }
    .avatar {
      display: grid;
      place-items: center;
      width: 5rem;
      height: 5rem;
      margin: 0 auto 1.25rem;
      border: 1px solid #bdff5e;
      border-radius: 50%;
      color: #bdff5e;
      background: #1d2616;
      font-size: 1.5rem;
      font-weight: 800;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 2.75rem);
      line-height: 1.15;
      overflow-wrap: anywhere;
    }
    header p { color: #c0c0cc; }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: .75rem;
    }
    .red {
      display: grid;
      grid-template-columns: 2.5rem minmax(0, 1fr);
      column-gap: 1rem;
      row-gap: .2rem;
      align-items: center;
      padding: 1rem;
      border: 1px solid #34343e;
      border-radius: 1rem;
      background: #1b1b22;
      color: inherit;
      text-decoration: none;
      min-height: 4.75rem;
    }
    .icono {
      display: grid;
      place-items: center;
      grid-row: 1 / 3;
      width: 2.5rem;
      height: 2.5rem;
      border-radius: .75rem;
      background: #282831;
      color: var(--color);
      font-weight: 800;
    }
    .nombre {
      grid-column: 2;
      font-weight: 700;
      overflow-wrap: anywhere;
    }
    .usuario {
      grid-column: 2;
      color: #c0c0cc;
      font-size: .875rem;
      overflow-wrap: anywhere;
    }
    .red:hover { border-color: #bdff5e; }
    .red:focus-visible {
      outline: 3px solid #bdff5e;
      outline-offset: 4px;
    }
    footer {
      text-align: center;
      color: #c0c0cc;
      font-size: .875rem;
      margin-top: 1.5rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="avatar" aria-hidden="true">JG</div>
      <h1>Jorgigamers</h1>
      <p>Mis redes sociales</p>
    </header>

    <ul aria-label="Redes sociales de Jorgigamers">
      <li>
        <a class="red" href="https://www.twitch.tv/jorgigamers"
           target="_blank" rel="noopener noreferrer">
          <span class="icono" style="--color:#c9a6ff" aria-hidden="true">TW</span>
          <span class="nombre">Twitch</span>
          <span class="usuario">@jorgigamers</span>
        </a>
      </li>
      <li>
        <a class="red" href="https://www.tiktok.com/@jorgitto260?_r=1&amp;_t=ZP-9ACnF4mpdM7"
           target="_blank" rel="noopener noreferrer">
          <span class="icono" style="--color:#6ce7eb" aria-hidden="true">TT</span>
          <span class="nombre">TikTok</span>
          <span class="usuario">@jorgitto260</span>
        </a>
      </li>
      <li>
        <a class="red" href="https://kick.com/jorgigamers"
           target="_blank" rel="noopener noreferrer">
          <span class="icono" style="--color:#53fc18" aria-hidden="true">K</span>
          <span class="nombre">Kick</span>
          <span class="usuario">jorgigamers</span>
        </a>
      </li>
      <li>
        <a class="red" href="https://www.facebook.com/share/1C2qBj6pxP/?mibextid=wwXIfr"
           target="_blank" rel="noopener noreferrer">
          <span class="icono" style="--color:#80b6ff" aria-hidden="true">f</span>
          <span class="nombre">Facebook</span>
          <span class="usuario">Mi Facebook</span>
        </a>
      </li>
      <li>
        <a class="red" href="https://youtube.com/@jorgi_gamers?si=rJogoaq8wcAcxQKC"
           target="_blank" rel="noopener noreferrer">
          <span class="icono" style="--color:#ff8b8b" aria-hidden="true">▶</span>
          <span class="nombre">YouTube</span>
          <span class="usuario">@jorgi_gamers</span>
        </a>
      </li>
    </ul>

    <footer>Los enlaces se abren en una pestaña nueva.</footer>
  </main>
</body>
</html>
